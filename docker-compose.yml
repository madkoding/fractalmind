services:
  ollama:
    image: ollama/ollama:latest
    container_name: fractalmind-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - fractalmind-network

  surrealdb:
    image: surrealdb/surrealdb:v1.5.6
    container_name: fractalmind-db
    restart: "no"
    ports:
      - "8000:8000"
    command:
      - start
      - --log=info
      - --user=root
      - --pass=root
      - --bind
      - 0.0.0.0:8000
      - memory
    volumes:
      - ./data/surrealdb:/data
    environment:
      - SURREAL_PATH=/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fractalmind-network

  searxng:
    image: searxng/searxng:latest
    container_name: fractalmind-searxng
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fractalmind-network

  fractalmind-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fractalmind-api
    restart: "no"
    ports:
      - "12000:9000"
    extra_hosts:
      - "tachikoma:host-gateway"
    depends_on:
      surrealdb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - RUST_LOG=debug,fractalmind=trace
      - SERVER_PORT=9000
      - SURREAL_URL=ws://surrealdb:8000
      - SURREAL_USER=root
      - SURREAL_PASS=root
      - SURREAL_NS=fractalmind
      - SURREAL_DB=knowledge
      - WEB_SEARCH_PROVIDER=searxng
      - WEB_SEARCH_BASE_URL=http://searxng:8080
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./target:/app/target
    networks:
      - fractalmind-network

networks:
  fractalmind-network:
    driver: bridge
